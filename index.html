<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARACAT — Уютное Меню</title>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3.0.3/tsparticles.bundle.min.js"></script>
    <style>
        :root {
            --bg-dark: #1a1614;
            --accent: #d48c56;
            --accent-light: #eac0a2;
            --glass: rgba(43, 36, 32, 0.85);
            --radius: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-dark);
            color: #fdf5e6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ФОН (Слой -2) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('https://i.ibb.co/fd34h4zH/image.jpg') no-repeat center center fixed;
            background-size: cover;
            filter: blur(8px);
            transform: scale(1.1);
            z-index: -2;
        }

        /* ЗАТЕМНЕНИЕ (Слой -1) */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(26, 22, 20, 0.65); 
            z-index: -1;
        }

        #tsparticles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* ШАПКА */
        .header { text-align: center; padding: 40px 20px; position: relative; z-index: 10; }
        .logo { font-size: clamp(34px, 8vw, 52px); font-weight: 900; letter-spacing: 5px; color: var(--accent-light); text-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        .info-btn {
            position: absolute; top: 40px; right: 20px;
            width: 44px; height: 44px; border: 2px solid var(--accent);
            border-radius: 14px; display: flex; justify-content: center; align-items: center;
            color: var(--accent); font-weight: 900; font-size: 22px; cursor: pointer;
            background: rgba(26, 22, 20, 0.5); transition: var(--transition); backdrop-filter: blur(5px);
            z-index: 11;
        }
        .info-btn:hover { background: var(--accent); color: var(--bg-dark); }

        .lang-switch { margin-top: 15px; position: relative; z-index: 10; }
        .lang-switch button {
            margin: 5px; padding: 8px 22px; border: 1px solid var(--accent); 
            border-radius: 20px; cursor: pointer; background: transparent; color: #fff; font-weight: bold;
        }
        .lang-switch button.active { background: var(--accent); color: var(--bg-dark); }

        /* НАВИГАЦИЯ */
        .nav { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; 
            margin: 25px auto; max-width: 1000px; padding: 0 10px; position: relative; z-index: 10;
        }
        .nav button {
            padding: 12px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);
            background: var(--glass); color: #fdf5e6; cursor: pointer; font-size: 13px; font-weight: 600;
            transition: var(--transition); backdrop-filter: blur(10px);
        }
        .nav button.active { border-color: var(--accent-light); color: var(--accent-light); background: rgba(212, 140, 86, 0.2); }

        /* МЕНЮ */
        .container { max-width: 1200px; margin: auto; padding: 10px 20px 120px; position: relative; z-index: 5; }
        .category h2 { border-left: 5px solid var(--accent); padding-left: 15px; margin: 40px 0 20px; text-transform: uppercase; font-size: 1.1rem; color: var(--accent-light); }
        .grid { display: grid; gap: 12px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }

        .menu-item {
            background: var(--glass); padding: 20px; border-radius: var(--radius);
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: var(--transition); border: 1px solid rgba(255,255,255,0.03);
            backdrop-filter: blur(8px);
        }
        .menu-item:hover { border-color: var(--accent); transform: translateY(-2px); }
        .menu-item b { color: var(--accent-light); }

        /* КОРЗИНА (Слой 100) */
        .cart {
            position: fixed; bottom: 30px; right: 30px; width: 75px; height: 75px;
            border-radius: 50%; background: var(--accent);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cart:active { transform: scale(0.9); }
        .cart-count { position: absolute; top: 0; right: 0; background: #fff; color: #000; font-size: 13px; font-weight: 900; padding: 4px 10px; border-radius: 14px; border: 2px solid var(--accent); }

        /* МОДАЛЬНЫЕ ОКНА (Слой 1000) */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(15px);
        }
        .modal-content {
            background: #2b2420; padding: 30px; border-radius: 30px;
            width: 92%; max-width: 440px; border: 1px solid var(--accent); 
            max-height: 85vh; overflow-y: auto; position: relative;
        }

        /* СОЦСЕТИ - ИСПРАВЛЕННЫЕ ЦВЕТА */
        .social-links { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .soc-item {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 16px; border-radius: 18px; text-decoration: none; color: #fff; font-weight: bold; transition: 0.3s;
        }
        .inst { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
        .tt { background: #000; border: 1px solid #444; }
        .tg { background: #0088cc; }

        input, textarea { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #3d342f; background: #1a1614; color: #fff; margin-bottom: 12px; font-size: 16px; }
        .close-btn { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 18px; color: var(--bg-dark); font-weight: 800; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

};

function switchLang(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-switch button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');
    document.getElementById('socTitle').textContent = menuData[lang].socTitle;
    document.getElementById('socDesc').textContent = menuData[lang].socDesc;
    render();
}

function render() {
    const menuC = document.getElementById("menu");
    const navC = document.getElementById("nav");
    menuC.innerHTML = ""; navC.innerHTML = "";
    const labels = menuData[currentLang].categories;
    const items = menuData[currentLang].items;

    const allBtn = document.createElement("button");
    allBtn.textContent = labels.all;
    allBtn.className = currentCategory === "all" ? "active" : "";
    allBtn.onclick = () => { currentCategory = "all"; render(); };
    navC.appendChild(allBtn);

    Object.keys(items).forEach(cat => {
        const btn = document.createElement("button");
        btn.textContent = cat;
        btn.className = currentCategory === cat ? "active" : "";
        btn.onclick = () => { currentCategory = cat; render(); };
        navC.appendChild(btn);

        if (currentCategory === "all" || currentCategory === cat) {
            const sec = document.createElement("div");
            sec.className = "category";
            sec.innerHTML = `<h2>${cat}</h2><div class="grid"></div>`;
            const grid = sec.querySelector(".grid");
            items[cat].forEach(item => {
                const div = document.createElement("div");
                div.className = "menu-item";
                div.innerHTML = `<span>${item[0]}</span><b>${item[1]} ₸</b>`;
                div.onclick = () => addToCart(item);
                grid.appendChild(div);
            });
            menuC.appendChild(sec);
        }
    });
}

function addToCart(item) {
    cart.push(item);
    document.getElementById("cartCount").textContent = cart.length;
    // Эффект нажатия на корзину
    const c = document.getElementById("cartBtn");
    c.style.transform = "scale(1.2)";
    setTimeout(() => c.style.transform = "scale(1)", 200);
}

function openSocial() { document.getElementById('socialModal').style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

document.getElementById("cartBtn").onclick = () => {
    const list = document.getElementById("cartItems");
    const foot = document.getElementById("cartFooter");
    const labels = menuData[currentLang].categories;
    list.innerHTML = ""; let total = 0;

    cart.forEach((item, i) => {
        total += item[1];
        list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:12px; background:rgba(0,0,0,0.2); padding:12px; border-radius:12px; border: 1px solid rgba(255,255,255,0.05);">
            <span>${item[0]}</span>
            <b>${item[1]} ₸ <span style="color:#ff4444; margin-left:15px; cursor:pointer;" onclick="cart.splice(${i},1); document.getElementById('cartBtn').click();">✕</span></b>
        </div>`;
    });

    const final = Math.floor(total * 1.1);
    foot.innerHTML = `<div style="margin-top:20px; border-top:1px solid #3d342f; padding-top:20px">
        <input type="number" id="table" placeholder="${labels.table}">
        <textarea id="comment" placeholder="${labels.comment}"></textarea>
        <div style="display:flex; justify-content:space-between; margin:15px 0; font-weight: bold; font-size: 1.1em;">
            <span>${labels.total}</span>
            <span style="color: var(--accent-light)">${final} ₸</span>
        </div>
        <button class="close-btn" style="background:#25D366; color:#fff" onclick="sendWA()">📱 ${labels.order}</button>
    </div>`;
    document.getElementById('cartModal').style.display = 'flex';
};

function sendWA() {
    const t = document.getElementById('table').value || '--';
    const c = document.getElementById('comment').value || '--';
    let msg = `*ЗАКАЗ BARACAT*\n📍 Стол: ${t}\n💬 Коммент: ${c}\n`;
    let sum = 0; cart.forEach((item, i) => { msg += `${i+1}. ${item[0]} - ${item[1]} ₸\n`; sum += item[1]; });
    msg += `*ИТОГО (+10%): ${Math.floor(sum*1.1)} ₸*`;
    window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(msg)}`);
}

tsParticles.load("tsparticles", {
    particles: { number: { value: 15 }, color: { value: "#d48c56" }, opacity: { value: 0.2 }, size: { value: 2 }, move: { enable: true, speed: 0.5, direction: "top" } }
});

switchLang('ru');
</script>

</html>
