<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <meta name="theme-color" content="#0a0a0b">
    <title>BARACAT — Меню</title>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3.0.3/tsparticles.bundle.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0b;
            --bg-2: #131316;
            --surface: #1a1a1d;
            --surface-2: #232327;
            --line: #2a2a2f;
            --text: #f5f5f7;
            --text-dim: #9a9aa3;
            --accent: #ff7a00;
            --accent-hover: #ff9133;
            --accent-soft: rgba(255, 122, 0, 0.12);
            --danger: #ff4d4d;
            --success: #25d366;
            --radius: 14px;
            --radius-lg: 20px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --header-h: 132px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body::before {
            content: "";
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at top, rgba(255, 122, 0, 0.08) 0%, transparent 55%),
                        radial-gradient(ellipse at bottom right, rgba(255, 122, 0, 0.05) 0%, transparent 50%),
                        var(--bg);
            z-index: -2;
        }

        #tsparticles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        a { color: inherit; text-decoration: none; }
        input, textarea, select { font-family: inherit; }

        /* ===== HEADER ===== */
        .header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(10, 10, 11, 0.85);
            backdrop-filter: saturate(180%) blur(14px);
            -webkit-backdrop-filter: saturate(180%) blur(14px);
            border-bottom: 1px solid var(--line);
        }
        .header-top {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px; max-width: 1240px; margin: 0 auto;
        }
        .logo {
            font-size: clamp(22px, 4.5vw, 28px);
            font-weight: 900; letter-spacing: 4px;
            color: var(--accent);
        }
        .logo span { color: var(--text); }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .icon-btn {
            width: 40px; height: 40px;
            border-radius: 12px;
            background: var(--surface);
            border: 1px solid var(--line);
            display: inline-flex; align-items: center; justify-content: center;
            color: var(--text);
            transition: var(--transition);
            font-size: 18px;
        }
        .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
        .icon-btn-call:hover { border-color: var(--success); color: var(--success); }
        .icon-btn-call svg { display: block; }

        .lang-switch {
            display: inline-flex; background: var(--surface); border: 1px solid var(--line);
            border-radius: 12px; padding: 3px; gap: 2px;
        }
        .lang-switch button {
            padding: 6px 12px; border-radius: 9px; font-weight: 700; font-size: 13px;
            color: var(--text-dim); transition: var(--transition);
        }
        .lang-switch button.active { background: var(--accent); color: #000; }

        /* Категории с горизонтальным скроллом */
        .nav-wrap {
            position: relative;
            border-top: 1px solid var(--line);
        }
        .nav {
            display: flex; gap: 8px;
            overflow-x: auto; overflow-y: hidden;
            padding: 12px 20px;
            max-width: 1240px; margin: 0 auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .nav::-webkit-scrollbar { display: none; }
        .nav button {
            flex-shrink: 0;
            padding: 9px 16px;
            border-radius: 10px;
            background: var(--surface);
            border: 1px solid var(--line);
            color: var(--text-dim);
            font-size: 13px; font-weight: 600;
            white-space: nowrap;
            transition: var(--transition);
        }
        .nav button:hover { color: var(--text); border-color: var(--text-dim); }
        .nav button.active {
            background: var(--accent); color: #000; border-color: var(--accent);
        }

        /* ===== MAIN ===== */
        main {
            max-width: 1240px; margin: 0 auto;
            padding: 24px 20px 140px;
            position: relative; z-index: 1;
        }

        .category { margin-bottom: 36px; scroll-margin-top: calc(var(--header-h) + 16px); }
        .category h2 {
            font-size: clamp(20px, 4vw, 26px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            color: var(--text);
            display: flex; align-items: center; gap: 12px;
        }
        .category h2::before {
            content: ""; width: 6px; height: 26px;
            background: var(--accent); border-radius: 3px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .menu-item {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 18px;
            display: flex; flex-direction: column;
            justify-content: space-between;
            min-height: 130px;
            transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition), opacity 0.5s ease;
            cursor: pointer;
            position: relative;
            will-change: transform;
        }
        .menu-item:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 14px 36px rgba(255, 122, 0, 0.28),
                        0 4px 14px rgba(0, 0, 0, 0.35);
        }

        /* Картинка блюда (опционально) */
        .menu-item-image {
            display: block;
            width: calc(100% + 36px);
            height: 160px;
            object-fit: cover;
            margin: -18px -18px 12px -18px;
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
            background: var(--surface-2);
        }
        @media (max-width: 600px) {
            .menu-item-image {
                width: calc(100% + 28px);
                margin: -14px -14px 10px -14px;
                height: 130px;
            }
        }

        /* fade-in on enter viewport */
        .menu-item.reveal {
            opacity: 0;
            transform: translateY(16px);
        }
        .menu-item.revealed {
            opacity: 1;
            transform: translateY(0);
        }
        @media (prefers-reduced-motion: reduce) {
            .menu-item.reveal { opacity: 1; transform: none; }
        }
        /* Бейджи на карточках */
        .badges {
            display: flex; flex-wrap: wrap; gap: 6px;
            margin-bottom: 8px;
        }
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px; font-weight: 800;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            line-height: 1;
        }
        .badge-hit  { background: rgba(255, 122, 0, 0.18); color: var(--accent); border: 1px solid rgba(255, 122, 0, 0.35); }
        .badge-spicy { background: rgba(255, 77, 77, 0.18); color: #ff7a7a; border: 1px solid rgba(255, 77, 77, 0.35); }
        .badge-new  { background: rgba(37, 211, 102, 0.16); color: #4ade80; border: 1px solid rgba(37, 211, 102, 0.35); }
        .badge-veg  { background: rgba(74, 222, 128, 0.14); color: #6ee7a4; border: 1px solid rgba(74, 222, 128, 0.3); }

        /* Вес/объём под названием */
        .menu-item-meta {
            font-size: 12px; color: var(--text-dim);
            margin-bottom: 6px; font-weight: 500;
        }

        .menu-item-name {
            font-size: 16px; font-weight: 700;
            line-height: 1.3; margin-bottom: 6px;
            color: var(--text);
        }
        .menu-item-desc {
            font-size: 12px; color: var(--text-dim);
            line-height: 1.4; margin-bottom: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 2; line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .menu-item-footer {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: auto;
        }
        .menu-item-price {
            font-size: 18px; font-weight: 800;
            color: var(--accent);
        }
        .add-btn {
            width: 38px; height: 38px;
            border-radius: 12px;
            background: var(--accent); color: #000;
            font-size: 22px; font-weight: 900;
            display: inline-flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .add-btn:hover { background: var(--accent-hover); transform: scale(1.06); }
        .add-btn:active { transform: scale(0.94); }
        .add-btn.bounce { animation: btn-bounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes btn-bounce {
            0%   { transform: scale(1); }
            30%  { transform: scale(1.25); }
            55%  { transform: scale(0.9); }
            80%  { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* Inline qty stepper on card (replaces + button when in cart) */
        .card-qty {
            display: inline-flex; align-items: center;
            background: var(--accent); color: #000;
            border-radius: 12px; padding: 3px;
            height: 38px;
            box-shadow: 0 4px 12px rgba(255, 122, 0, 0.3);
            animation: qty-pop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card-qty button {
            width: 32px; height: 32px; border-radius: 9px;
            font-size: 18px; font-weight: 900;
            color: #000;
            display: inline-flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .card-qty button:hover { background: rgba(0, 0, 0, 0.12); }
        .card-qty button:active { transform: scale(0.9); }
        .card-qty .v {
            min-width: 22px; text-align: center;
            font-weight: 900; font-size: 15px;
            padding: 0 4px;
        }
        @keyframes qty-pop {
            0%   { transform: scale(0.6); opacity: 0; }
            70%  { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); }
        }

        /* ===== FAB CART ===== */
        .cart-fab {
            position: fixed; bottom: 24px; right: 24px;
            min-width: 64px; height: 64px;
            padding: 0 22px;
            border-radius: 32px;
            background: var(--accent); color: #000;
            display: inline-flex; align-items: center; gap: 10px;
            font-weight: 800; font-size: 15px;
            box-shadow: 0 12px 32px rgba(255, 122, 0, 0.4);
            z-index: 80;
            transition: var(--transition);
        }
        .cart-fab:hover { background: var(--accent-hover); transform: translateY(-2px); }
        .cart-fab .cart-icon { font-size: 22px; display: inline-block; }
        .cart-fab.empty .cart-total { display: none; }
        .cart-fab .cart-count {
            background: #000; color: var(--accent);
            border-radius: 999px; padding: 2px 8px;
            font-size: 12px; min-width: 22px; text-align: center;
            transition: transform 0.2s ease;
        }
        .cart-fab.pulse { animation: fab-pulse 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .cart-fab.pulse .cart-icon { animation: fab-shake 0.55s ease; }
        .cart-fab.pulse .cart-count { transform: scale(1.25); }
        @keyframes fab-pulse {
            0%   { transform: scale(1); box-shadow: 0 12px 32px rgba(255, 122, 0, 0.4); }
            40%  { transform: scale(1.12); box-shadow: 0 18px 44px rgba(255, 122, 0, 0.65), 0 0 0 14px rgba(255, 122, 0, 0.18); }
            100% { transform: scale(1); box-shadow: 0 12px 32px rgba(255, 122, 0, 0.4); }
        }
        @keyframes fab-shake {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-12deg); }
            55% { transform: rotate(10deg); }
            80% { transform: rotate(-4deg); }
        }

        /* ===== SIDEBAR CART ===== */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 90;
            opacity: 0; pointer-events: none;
            transition: opacity var(--transition);
        }
        .overlay.show { opacity: 1; pointer-events: auto; }

        .sidebar {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: 100%; max-width: 440px;
            background: var(--bg-2);
            border-left: 1px solid var(--line);
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
            z-index: 100;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex; flex-direction: column;
            will-change: transform;
        }
        .sidebar.show { transform: translateX(0); }
        .sidebar.slide-in { animation: sidebar-slide-in 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes sidebar-slide-in {
            0%   { transform: translateX(100%); }
            100% { transform: translateX(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .sidebar { transition: none; }
            .sidebar.slide-in { animation: none; }
        }

        .sidebar-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }
        .sidebar-header h2 {
            font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
        }
        .close-x {
            width: 36px; height: 36px; border-radius: 10px;
            background: var(--surface); border: 1px solid var(--line);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 18px; transition: var(--transition);
        }
        .close-x:hover { color: var(--accent); border-color: var(--accent); }

        .sidebar-body {
            flex: 1; overflow-y: auto;
            padding: 18px 20px;
        }

        .order-modes {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 6px; margin-bottom: 18px;
            background: var(--surface); padding: 4px;
            border-radius: 12px; border: 1px solid var(--line);
        }
        .order-modes button {
            padding: 10px 6px; border-radius: 9px;
            font-size: 12px; font-weight: 700;
            color: var(--text-dim);
            transition: var(--transition);
        }
        .order-modes button.active { background: var(--accent); color: #000; }

        .cart-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }

        .cart-item {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 12px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px; align-items: center;
        }
        .cart-item-name { font-weight: 600; font-size: 14px; line-height: 1.3; }
        .cart-item-price { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
        .qty {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--bg); border: 1px solid var(--line);
            border-radius: 10px; padding: 3px;
        }
        .qty button {
            width: 28px; height: 28px; border-radius: 7px;
            font-size: 16px; font-weight: 800;
            color: var(--text);
            transition: var(--transition);
        }
        .qty button:hover { background: var(--surface-2); color: var(--accent); }
        .qty .val { min-width: 22px; text-align: center; font-weight: 700; font-size: 14px; }

        .cart-empty {
            text-align: center; padding: 60px 20px;
            color: var(--text-dim);
        }
        .cart-empty-icon { font-size: 56px; margin-bottom: 14px; opacity: 0.4; }

        .order-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .input, .textarea {
            width: 100%; padding: 12px 14px;
            background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--text); font-size: 14px;
            transition: var(--transition);
        }
        .input:focus, .textarea:focus { outline: none; border-color: var(--accent); }
        .textarea { resize: vertical; min-height: 64px; }

        .totals {
            background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 14px; margin-bottom: 14px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .totals-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-dim); }
        .totals-row.final {
            font-size: 16px; font-weight: 800; color: var(--text);
            border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px;
        }
        .totals-row.final span:last-child { color: var(--accent); }

        /* Строка инфо о доставке/самовывозе */
        .delivery-info {
            display: flex; align-items: center; gap: 10px;
            background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 12px 14px; margin-bottom: 12px;
            font-size: 13px; color: var(--text-dim);
        }
        .delivery-info .di-icon {
            font-size: 18px;
            flex-shrink: 0;
        }
        .delivery-info b {
            color: var(--text); font-weight: 700; margin-right: 4px;
        }
        .delivery-info .di-free { color: #4ade80; font-weight: 700; }

        .pay-warn {
            font-size: 12px; line-height: 1.4;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px dashed var(--accent);
            border-radius: var(--radius);
            padding: 10px 12px; margin-bottom: 12px;
            text-align: center;
        }

        .btn {
            width: 100%; padding: 14px;
            border-radius: var(--radius);
            font-weight: 800; font-size: 15px;
            text-transform: uppercase; letter-spacing: 0.5px;
            transition: var(--transition);
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-wa { background: var(--success); color: #fff; }
        .btn-wa:hover { background: #1eb755; }
        .btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); }

        /* ===== MODAL (item details + info) ===== */
        .modal {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center; justify-content: center;
            z-index: 110;
            padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-card {
            background: var(--bg-2);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            width: 100%; max-width: 440px;
            max-height: 88vh; overflow-y: auto;
            padding: 24px;
            position: relative;
        }
        .modal-close {
            position: absolute; top: 14px; right: 14px;
            width: 36px; height: 36px; border-radius: 10px;
            background: var(--surface); border: 1px solid var(--line);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 18px; transition: var(--transition);
        }
        .modal-close:hover { color: var(--accent); border-color: var(--accent); }
        .modal-card h2 {
            font-size: 22px; font-weight: 800;
            margin-bottom: 10px; padding-right: 40px;
        }
        .modal-card .desc {
            color: var(--text-dim); font-size: 14px;
            line-height: 1.55; margin-bottom: 18px;
        }
        .modal-price-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 16px;
        }
        .modal-price { font-size: 24px; font-weight: 900; color: var(--accent); }

        .social-list { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
        .soc-item {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 14px;
            border-radius: var(--radius);
            font-weight: 700;
            transition: var(--transition);
        }
        .soc-inst { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); color: #fff; }
        .soc-tt { background: #000; color: #fff; border: 1px solid var(--line); }
        .soc-tg { background: #0088cc; color: #fff; }
        .soc-call { background: var(--danger); color: #fff; }
        .soc-item:hover { transform: translateY(-2px); }

        /* ===== Mobile ===== */
        @media (max-width: 600px) {
            :root { --header-h: 124px; }
            .header-top { padding: 12px 14px; }
            .nav { padding: 10px 14px; }
            main { padding: 18px 14px 120px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
            .menu-item { padding: 14px; min-height: 120px; }
            .menu-item-name { font-size: 14px; }
            .menu-item-price { font-size: 16px; }
            .add-btn { width: 34px; height: 34px; font-size: 20px; }
            .cart-fab { right: 14px; bottom: 14px; padding: 0 18px; min-width: 58px; height: 58px; }
            .sidebar { max-width: 100%; }
        }

        @media (max-width: 380px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }

        /* No-scroll when sidebar/modal open */
        body.lock { overflow: hidden; }
    </style>
</head>
<body>

<div id="tsparticles"></div>

<header class="header">
    <div class="header-top">
        <div class="logo">BARA<span>CAT</span></div>
        <div class="header-actions">
            <div class="lang-switch">
                <button id="btn-ru" onclick="switchLang('ru')" class="active">RU</button>
                <button id="btn-kz" onclick="switchLang('kz')">KZ</button>

// ===== Helpers =====
const $ = (id) => document.getElementById(id);
const t = () => dict[currentLang];

// Бейджи: i18n + класс
const BADGES = {
    hit:   { ru: "🔥 Хит",     kz: "🔥 Хит",     cls: "badge-hit" },
    spicy: { ru: "🌶 Острое",  kz: "🌶 Ащы",     cls: "badge-spicy" },
    new:   { ru: "✨ Новинка", kz: "✨ Жаңа",    cls: "badge-new" },
    veg:   { ru: "🌱 Veg",     kz: "🌱 Veg",     cls: "badge-veg" }
};

function badgeHtml(key) {
    const b = BADGES[key];
    if (!b) return "";
    return `<span class="badge ${b.cls}">${b[currentLang] || b.ru}</span>`;
}

function findItem(id) {
    const cats = menuData[currentLang];
    for (const key in cats) {
        const it = cats[key].items.find(x => x.id === id);
        if (it) return it;
    }
    return null;
}

// ===== Render =====
function renderNav() {
    const nav = $("nav");
    nav.innerHTML = "";
    const cats = menuData[currentLang];
    Object.keys(cats).forEach((catId, i) => {
        const btn = document.createElement("button");
        btn.textContent = cats[catId].name;
        btn.dataset.cat = catId;
        btn.onclick = () => scrollToCategory(catId);
        if (i === 0 && !activeCategoryId) activeCategoryId = catId;
        if (catId === activeCategoryId) btn.classList.add("active");
        nav.appendChild(btn);
    });
}

function getQty(id) {
    const c = cart.find(x => x.id === id);
    return c ? c.qty : 0;
}

function renderItemControl(itemId) {
    const qty = getQty(itemId);
    if (qty > 0) {
        return `
            <div class="card-qty" data-control="qty">
                <button data-action="dec" aria-label="−">−</button>
                <span class="v">${qty}</span>
                <button data-action="inc" aria-label="+">+</button>
            </div>`;
    }
    return `<button class="add-btn" data-control="add" aria-label="Add">+</button>`;
}

function updateCardControl(itemId) {
    const card = document.querySelector(`.menu-item[data-id="${itemId}"]`);
    if (!card) return;
    const slot = card.querySelector("[data-control-slot]");
    if (!slot) return;
    const wasAddBtn = !!slot.querySelector(".add-btn");
    slot.innerHTML = renderItemControl(itemId);
    // если была кнопка + и теперь stepper — pop-анимация уже на CSS;
    // если осталась + (товар удалён) — bounce при добавлении делается отдельно
    return { slot, wasAddBtn };
}

function renderMenu() {
    const menu = $("menu");
    menu.innerHTML = "";
    const cats = menuData[currentLang];
    Object.keys(cats).forEach(catId => {
        const cat = cats[catId];
        const sec = document.createElement("section");
        sec.className = "category";
        sec.id = "cat-" + catId;
        sec.dataset.cat = catId;
        sec.innerHTML = `<h2>${cat.name}</h2><div class="grid"></div>`;
        const grid = sec.querySelector(".grid");

        cat.items.forEach(item => {
            const card = document.createElement("article");
            card.className = "menu-item reveal";
            card.dataset.id = item.id;
            const badgesHtml = item.badge
                ? `<div class="badges">${badgeHtml(item.badge)}</div>` : "";
            const metaHtml = item.weight
                ? `<div class="menu-item-meta">${item.weight}</div>` : "";
            const imageHtml = item.image
                ? `<img class="menu-item-image" src="${item.image}" alt="" loading="lazy" onerror="this.remove()">`
                : "";
            card.innerHTML = `
                <div>
                    ${imageHtml}
                    ${badgesHtml}
                    <div class="menu-item-name">${item.name}</div>
                    ${metaHtml}
                    <div class="menu-item-desc">${item.desc || ""}</div>
                </div>
                <div class="menu-item-footer">
                    <div class="menu-item-price">${item.price.toLocaleString('ru-RU')} ₸</div>
                    <span data-control-slot>${renderItemControl(item.id)}</span>
                </div>
            `;
            // click on card -> details modal (но не на контролах)
            card.addEventListener("click", (e) => {
                if (e.target.closest("[data-control-slot]")) return;
                openItemModal(item.id);
            });
            // делегирование кликов на + / − / qty-кнопки
            card.querySelector("[data-control-slot]").addEventListener("click", (e) => {
                e.stopPropagation();
                const addBtn = e.target.closest('[data-control="add"]');
                const dec = e.target.closest('[data-action="dec"]');
                const inc = e.target.closest('[data-action="inc"]');
                if (addBtn) {
                    // bounce на кнопке + (видим короткий пик до замены на stepper)
                    addBtn.classList.remove("bounce");
                    void addBtn.offsetWidth;
                    addBtn.classList.add("bounce");
                    // даём анимации стартовать прежде чем DOM-узел заменится
                    requestAnimationFrame(() => {
                        addToCart(item.id);
                        pulseFab();
                    });
                } else if (inc) {
                    changeQty(item.id, 1);
                    pulseFab();
                } else if (dec) {
                    changeQty(item.id, -1);
                    pulseFab();
                }
            });
            grid.appendChild(card);
            // подключаем к observer'у
            if (revealObserver) revealObserver.observe(card);
        });

        menu.appendChild(sec);
    });
}

function pulseFab() {
    const fab = $("cartFab");
    if (!fab) return;
    fab.classList.remove("pulse");
    void fab.offsetWidth; // force reflow для рестарта анимации
    fab.classList.add("pulse");
    setTimeout(() => fab.classList.remove("pulse"), 600);
}

// Backward-compat alias (если где-то остался вызов)
function bumpFab() { pulseFab(); }

function switchLang(lang) {

    $("btn-ru").classList.toggle("active", lang === "ru");

// ===== Smooth-scroll nav + scroll-spy =====
function scrollToCategory(catId) {
    activeCategoryId = catId;
    updateNavActive();
    const sec = document.getElementById("cat-" + catId);
    if (!sec) return;
    isScrollingProgrammatically = true;
    sec.scrollIntoView({ behavior: "smooth", block: "start" });
    setTimeout(() => isScrollingProgrammatically = false, 700);
}

function updateNavActive() {
    document.querySelectorAll(".nav button").forEach(b => {
        b.classList.toggle("active", b.dataset.cat === activeCategoryId);
    });
    // ensure active button is visible in horizontal scroll
    const active = document.querySelector(".nav button.active");
    if (active) active.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
}

function setupScrollSpy() {
    const observer = new IntersectionObserver((entries) => {
        if (isScrollingProgrammatically) return;
        // pick the entry closest to the top among intersecting
        const visible = entries.filter(e => e.isIntersecting);
        if (visible.length === 0) return;
        visible.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        const id = visible[0].target.dataset.cat;
        if (id && id !== activeCategoryId) {
            activeCategoryId = id;
            updateNavActive();
        }
    }, {
        rootMargin: "-150px 0px -60% 0px",
        threshold: [0, 0.1, 0.5, 1]
    });
    document.querySelectorAll(".category").forEach(s => observer.observe(s));
}

// IntersectionObserver для fade-in карточек при появлении в viewport
function setupRevealObserver() {
    if (!("IntersectionObserver" in window)) {
        revealObserver = { observe: (el) => el.classList.add("revealed") };
        return;
    }
    revealObserver = new IntersectionObserver((entries, obs) => {
        entries.forEach((entry, i) => {
            if (!entry.isIntersecting) return;
            // лёгкий stagger по индексу пакета
            const delay = Math.min(i * 40, 240);
            setTimeout(() => entry.target.classList.add("revealed"), delay);
            obs.unobserve(entry.target);
        });
    }, {
        rootMargin: "0px 0px -10% 0px",
        threshold: 0.05
    });
}

// ===== Cart =====
function addToCart(id) {
    const item = findItem(id);
    if (!item) return;
    const existing = cart.find(c => c.id === id);
    if (existing) existing.qty += 1;
    else cart.push({ id, name: item.name, price: item.price, qty: 1, paloma_id: item.paloma_id || 0 });
    updateCardControl(id);
    renderCart();
}
function changeQty(id, delta) {
    const c = cart.find(x => x.id === id);
    if (!c) return;
    c.qty += delta;
    if (c.qty <= 0) cart = cart.filter(x => x.id !== id);
    updateCardControl(id);
    renderCart();
}
function removeFromCart(id) {
    cart = cart.filter(x => x.id !== id);
    updateCardControl(id);
    renderCart();
}

function calcTotals() {
    const subtotal = cart.reduce((s, c) => s + c.price * c.qty, 0);
    const isService = currentMode === "dinein";
    const service = isService ? Math.floor(subtotal * SERVICE_FEE) : 0;
    const total = subtotal + service;
    return { subtotal, service, total, isService };
}

function renderCart() {
    const T = t();
    const count = cart.reduce((s, c) => s + c.qty, 0);
    $("cartCount").textContent = count;
    const fab = $("cartFab");
    fab.classList.toggle("empty", count === 0);
    const { subtotal, service, total, isService } = calcTotals();
    $("cartFabTotal").textContent = count > 0 ? total.toLocaleString('ru-RU') + " ₸" : "";

    // mode buttons
    document.querySelectorAll("#orderModes button").forEach(b => {
        b.classList.toggle("active", b.dataset.mode === currentMode);
    });

    const content = $("cartContent");
    if (cart.length === 0) {
        content.innerHTML = `
            <div class="cart-empty">
                <div class="cart-empty-icon">🛒</div>
                <div style="font-weight: 800; font-size: 18px; margin-bottom: 6px; color: var(--text);">${T.empty}</div>
                <div style="font-size: 13px;">${T.emptyHint}</div>
            </div>`;
        return;
    }

    const list = cart.map(c => `
        <div class="cart-item">
            <div>
                <div class="cart-item-name">${c.name}</div>
                <div class="cart-item-price">${c.price.toLocaleString('ru-RU')} ₸ × ${c.qty} = <b style="color:var(--accent)">${(c.price * c.qty).toLocaleString('ru-RU')} ₸</b></div>
            </div>
            <div class="qty">
                <button onclick="changeQty('${c.id}', -1)">−</button>
                <span class="val">${c.qty}</span>
                <button onclick="changeQty('${c.id}', 1)">+</button>
            </div>
        </div>
    `).join("");

    // Информационная строка под списком (зависит от режима)
    let deliveryInfoHtml = "";
    if (currentMode === "delivery") {
        deliveryInfoHtml = `
            <div class="delivery-info">
                <span class="di-icon">🛵</span>
                <span><b>${T.deliveryInfoTitle}</b> ${T.deliveryInfoTime} • <span class="di-free">${T.deliveryInfoFree}</span></span>
            </div>`;
    } else if (currentMode === "takeaway") {
        deliveryInfoHtml = `
            <div class="delivery-info">
                <span class="di-icon">🥡</span>
                <span><b>${T.takeawayInfoTitle}</b> ${T.takeawayInfoTime}</span>
            </div>`;
    } else {
        deliveryInfoHtml = `
            <div class="delivery-info">
                <span class="di-icon">🍽</span>
                <span><b>${T.dineinInfoTitle}</b> • ${T.dineinInfoNote}</span>
            </div>`;
    }

    let extraField = "";
    if (currentMode === "dinein") {
        extraField = `<input type="text" class="input" id="fTable" placeholder="${T.table}">`;
    } else if (currentMode === "delivery") {
        extraField = `<input type="text" class="input" id="fAddress" placeholder="${T.address}">`;
    }

    content.innerHTML = `
        <div class="cart-list">${list}</div>

        ${deliveryInfoHtml}

        <div class="order-form">
            <input type="text" class="input" id="fName" placeholder="${T.name}">
            <input type="tel" class="input" id="fPhone" placeholder="${T.phone}">
            ${extraField}
            <textarea class="textarea" id="fComment" placeholder="${T.comment}"></textarea>
        </div>

        <div class="totals">
            <div class="totals-row"><span>${T.subtotal}</span><span>${subtotal.toLocaleString('ru-RU')} ₸</span></div>
            ${isService ? `<div class="totals-row"><span>${T.service}</span><span>${service.toLocaleString('ru-RU')} ₸</span></div>` : ""}
            <div class="totals-row final"><span>${T.total}</span><span>${total.toLocaleString('ru-RU')} ₸</span></div>
        </div>

        <div class="pay-warn">${T.paymentWarn}</div>

        <button class="btn btn-wa" onclick="sendWhatsApp()">📱 ${T.order}</button>
    `;
}

function setMode(mode) {
    currentMode = mode;
    renderCart();
}

function openCart() {
    const sidebar = $("cartSidebar");
    $("cartOverlay").classList.add("show");
    // если открывается заново и transition уже отыграл — прогоним явную keyframe-анимацию
    if (!sidebar.classList.contains("show")) {
        sidebar.classList.remove("slide-in");
        void sidebar.offsetWidth; // reflow для рестарта
        sidebar.classList.add("slide-in");
        // снимем класс после окончания, чтобы не блокировал последующие transition
        setTimeout(() => sidebar.classList.remove("slide-in"), 500);
    }
    sidebar.classList.add("show");
    sidebar.setAttribute("aria-hidden", "false");
    document.body.classList.add("lock");
}
function closeCart() {
    $("cartOverlay").classList.remove("show");
    $("cartSidebar").classList.remove("show");
    $("cartSidebar").setAttribute("aria-hidden", "true");
    document.body.classList.remove("lock");
}

// ===== Item modal =====
let currentItemId = null;
function openItemModal(id) {
    const item = findItem(id);
    if (!item) return;
    currentItemId = id;
    $("itemBadges").innerHTML = item.badge
        ? `<div class="badges">${badgeHtml(item.badge)}</div>` : "";
    $("itemTitle").textContent = item.name;
    $("itemMeta").textContent = item.weight || "";
    $("itemMeta").style.display = item.weight ? "" : "none";
    $("itemDesc").textContent = item.desc || "";
    $("itemPrice").textContent = item.price.toLocaleString('ru-RU') + " ₸";
    $("itemAddBtn").onclick = () => {
        addToCart(id);
        bumpFab();
        closeModal("itemModal");
    };
    openModal("itemModal");
}

function openModal(id) {
    $(id).classList.add("show");
    document.body.classList.add("lock");
}
function closeModal(id) {
    $(id).classList.remove("show");
    if (!$("cartSidebar").classList.contains("show")) {
        document.body.classList.remove("lock");
    }
}

// ===== Paloma365 integration =====
function formatPalomaDate(d) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
           `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

async function sendToPaloma(cart, tableNumber) {
    const { total } = calcTotals();
    const payload = {
        order_id: String(Date.now()),
        date: formatPalomaDate(new Date()),
        name: "Гость",
        phone: "+77000000000",
        comment: "Стол №" + (tableNumber || "—"),
        total_price: total,
        delivery_type: 1,
        is_cash: true,
        is_payed: false,
        order_items: cart.map(c => ({
            object_id: c.paloma_id || 0,
            name: c.name,
            count: c.qty,
            price: c.price,
            modifications: []
        }))
    };

    const url = `https://spring-heart-f97a.arsen-kim-us7.workers.dev`;

    const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });

    let data = null;
    try { data = await res.json(); } catch (_) {}
    console.log("Paloma response status:", res.status);
    console.log("Paloma response data:", data);

    const ok = res.ok && data && (data.status === "ok" || data.status === "new" || data.success === true || data.result === "ok");
    return { ok, info: (data && (data.info || data.message || data.error)) || (ok ? "Заказ принят" : "Ошибка отправки"), data };
}

async function sendWhatsApp() {
    if (cart.length === 0) return;
    const T = t();

    const name = ($("fName")?.value || "").trim() || T.guest;
    const phone = ($("fPhone")?.value || "").trim() || T.notSpecified;
    const comment = ($("fComment")?.value || "").trim() || "—";
    const tableVal = $("fTable") ? ($("fTable").value || "").trim() : "";
    const addressVal = $("fAddress") ? ($("fAddress").value || "").trim() : "";

    const orderId = Math.floor(1000 + Math.random() * 9000);
    const now = new Date();
    const gmt5 = new Date(now.getTime() + (now.getTimezoneOffset() + 300) * 60000)
        .toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

    const { subtotal, service, total, isService } = calcTotals();

    // Кнопка отправки → "Отправляем..."
    const btn = document.querySelector(".btn.btn-wa");
    let originalBtnHtml = null;
    if (btn) {
        originalBtnHtml = btn.innerHTML;
        btn.disabled = true;
        btn.style.opacity = "0.7";
        btn.style.cursor = "not-allowed";
        btn.innerHTML = "⏳ Отправляем...";
    }

    // 1) Шлём заказ в Paloma365 (snapshot корзины перед очисткой)
    const cartSnapshot = cart.map(c => ({ ...c }));
    let palomaResult = { ok: false, info: "Нет ответа от сервера" };
    try {
        palomaResult = await sendToPaloma(cartSnapshot, tableVal);
    } catch (err) {
        palomaResult = { ok: false, info: "Сеть недоступна: " + (err.message || err) };
    }

    if (palomaResult.ok) {
        alert("✅ Заказ принят ✓");
    } else {
        alert("⚠ " + (palomaResult.info || "Ошибка отправки в Paloma") + "\n\nЗаказ всё равно будет отправлен через WhatsApp.");
    }

    // 2) Восстанавливаем кнопку
    if (btn) {
        btn.disabled = false;
        btn.style.opacity = "";
        btn.style.cursor = "";
        if (originalBtnHtml !== null) btn.innerHTML = originalBtnHtml;
    }

    // 3) Открываем WhatsApp в любом случае
    let msg = `*BARACAT — ЗАКАЗ №${orderId}* [${gmt5}]\n`;
    msg += `━━━━━━━━━━━━━━\n`;
    msg += `${T.modeLabel[currentMode]}\n`;
    msg += `👤 ${T.name}: ${name}\n`;
    msg += `📞 ${T.phone}: ${phone}\n`;
    if (currentMode === "dinein") msg += `🍽 ${T.table}: ${tableVal || T.notSpecified}\n`;
    if (currentMode === "delivery") msg += `📍 ${T.address}: ${addressVal || T.notSpecified}\n`;
    msg += `💬 ${T.comment.split("(")[0].trim()}: ${comment}\n`;
    msg += `━━━━━━━━━━━━━━\n`;
    cartSnapshot.forEach((c, i) => {
        msg += `${i + 1}. ${c.name} × ${c.qty} — ${(c.price * c.qty).toLocaleString('ru-RU')} ₸\n`;
    });
    msg += `━━━━━━━━━━━━━━\n`;
    msg += `${T.subtotal} ${subtotal.toLocaleString('ru-RU')} ₸\n`;
    if (isService) msg += `${T.service} ${service.toLocaleString('ru-RU')} ₸\n`;
    msg += `*${T.total} ${total.toLocaleString('ru-RU')} ₸*`;
    if (palomaResult.ok) msg += `\n_Принят в систему ✓_`;

    window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
}
