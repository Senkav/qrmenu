<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARACAT Restaurant</title>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-confetti@2.12.0/tsparticles.confetti.bundle.min.js"></script>
    <style>
        :root {
            --bg: #0f0f10;
            --card: rgba(25, 25, 28, 0.95);
            --accent: #ff7a00;
            --accent-light: #ff9d3c;
            --radius: 20px;
            --transition: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #fff; overflow-x: hidden; }

        #tsparticles { position: fixed; inset: 0; z-index: -1; }

        .header { text-align: center; padding: 40px 20px; position: relative; z-index: 10; }
        .logo { font-size: clamp(32px, 8vw, 48px); font-weight: 900; letter-spacing: 6px; color: var(--accent); }

        .lang-switch { margin-top: 15px; }
        .lang-switch button {
            margin: 5px; padding: 8px 16px; border: 1px solid var(--accent); 
            border-radius: 20px; cursor: pointer; background: transparent; color: #fff;
        }
        .lang-switch button.active { background: var(--accent); }

        .nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 20px auto; max-width: 1000px; }
        .nav button {
            padding: 10px 15px; border-radius: 15px; border: 1px solid transparent;
            background: var(--card); color: #fff; cursor: pointer; font-size: 13px;
        }
        .nav button.active { border-color: var(--accent); color: var(--accent); }

        .container { max-width: 1200px; margin: auto; padding: 10px 20px 100px; position: relative; z-index: 1; }
        .category { margin-top: 40px; }
        .category h2 { border-left: 4px solid var(--accent); padding-left: 10px; margin-bottom: 20px; text-transform: uppercase; font-size: 1.2rem; }

        .grid { display: grid; gap: 12px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media(min-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        .menu-item {
            background: var(--card); padding: 18px; border-radius: var(--radius);
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: var(--transition); border: 1px solid rgba(255,255,255,0.05);
        }
        .menu-item:hover { transform: translateY(-3px); border-color: var(--accent); }
        .menu-item b { color: var(--accent); white-space: nowrap; margin-left: 10px; }

        .cart {
            position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px;
            border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-light));
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-size: 24px; z-index: 100; box-shadow: 0 5px 20px rgba(255,122,0,0.4);
        }
        .cart-count {
            position: absolute; top: -5px; right: -5px; background: #fff;
            color: #000; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 10px;
        }

        .flying-item {
            position: fixed; background: var(--accent); width: 15px; height: 15px;
            border-radius: 50%; z-index: 9999; pointer-events: none;
            transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px);
        }
        .modal-content {
            background: #1a1a1d; padding: 25px; border-radius: var(--radius);
            width: 95%; max-width: 450px; border: 1px solid #333; max-height: 85vh; overflow-y: auto;
        }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center; }
        .remove-btn { background: #ff4444; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
        .close-btn { margin-top: 20px; width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-weight: bold; cursor: pointer; }
        
        input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; margin-bottom: 10px; }
    </style>
</head>

function switchLang(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-switch button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');
    render();
}

function render() {
    const menuContainer = document.getElementById("menu");
    const navContainer = document.getElementById("nav");
    menuContainer.innerHTML = ""; navContainer.innerHTML = "";

    const data = menuData[currentLang].items;
    const labels = menuData[currentLang].categories;

    const allBtn = document.createElement("button");
    allBtn.textContent = labels.all;
    allBtn.onclick = () => { currentCategory = "all"; render(); };
    if (currentCategory === "all") allBtn.classList.add("active");
    navContainer.appendChild(allBtn);

    Object.keys(data).forEach(cat => {
        const btn = document.createElement("button");
        btn.textContent = cat;
        btn.onclick = () => { currentCategory = cat; render(); };
        if (currentCategory === cat) btn.classList.add("active");
        navContainer.appendChild(btn);

        if (currentCategory !== "all" && currentCategory !== cat) return;

        const section = document.createElement("div");
        section.className = "category";
        section.innerHTML = `<h2>${cat}</h2><div class="grid"></div>`;
        const grid = section.querySelector(".grid");

        data[cat].forEach(item => {
            const div = document.createElement("div");
            div.className = "menu-item";
            div.innerHTML = `<span>${item[0]}</span><b>${item[1]} ₸</b>`;
            div.onclick = (e) => addToCart(item, e);
            grid.appendChild(div);
        });
        menuContainer.appendChild(section);
    });
    document.getElementById('cartTitle').textContent = labels.cart;
}

function addToCart(item, event) {
    cart.push(item);
    document.getElementById("cartCount").textContent = cart.length;

    const flyer = document.createElement('div');
    flyer.className = 'flying-item';
    flyer.style.left = event.clientX + 'px';
    flyer.style.top = event.clientY + 'px';
    document.body.appendChild(flyer);

    const cartIcon = document.getElementById('cartBtn').getBoundingClientRect();
    setTimeout(() => {
        flyer.style.left = (cartIcon.left + 30) + 'px';
        flyer.style.top = (cartIcon.top + 30) + 'px';
        flyer.style.transform = 'scale(0.1)';
        flyer.style.opacity = '0';
    }, 50);
    setTimeout(() => flyer.remove(), 750);
}

document.getElementById("cartBtn").onclick = () => {
    const list = document.getElementById("cartItems");
    const labels = menuData[currentLang].categories;
    list.innerHTML = ""; let total = 0;

    if (cart.length === 0) {
        list.innerHTML = `<p style="text-align:center; opacity:0.5">${labels.empty}</p>`;
    } else {
        cart.forEach((item, index) => {
            total += item[1];
            list.innerHTML += `<div class="cart-item"><span>${item[0]}</span><div>${item[1]} ₸ <button class="remove-btn" onclick="removeItem(${index})">✕</button></div></div>`;
        });
    }

    const finalPrice = Math.floor(total * 1.1);
    document.getElementById("total").innerHTML = `
        <input type="number" id="tableNum" placeholder="${labels.table}">
        <textarea id="orderComment" placeholder="${labels.comment}"></textarea>
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <b>${labels.total}</b><b>${finalPrice} ₸</b>
        </div>
        <button class="close-btn" style="background:#25D366" onclick="sendWhatsApp()">📱 ${labels.order}</button>`;
    document.getElementById("modal").style.display = "flex";
};

function sendWhatsApp() {
    if (cart.length === 0) return;
    const table = document.getElementById('tableNum').value || '---';
    const comment = document.getElementById('orderComment').value || '---';
    let total = 0;
    let text = `*ЗАКАЗ: BARACAT*\n━━━━━━━━━━━━━━\n📍 *Стол:* ${table}\n💬 *Коммент:* ${comment}\n━━━━━━━━━━━━━━\n`;
    cart.forEach((item, i) => { text += `${i+1}. ${item[0]} (${item[1]} ₸)\n`; total += item[1]; });
    text += `━━━━━━━━━━━━━━\n*ИТОГО (+10%): ${Math.floor(total*1.1)} ₸*`;
    window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(text)}`);
}

function removeItem(index) {
    cart.splice(index, 1);
    document.getElementById("cartCount").textContent = cart.length;
    document.getElementById("cartBtn").click();
}

function closeCart() { document.getElementById("modal").style.display = "none"; }

tsParticles.load("tsparticles", {
    particles: {
        number: { value: 30 },
        color: { value: "#ff7a00" },
        opacity: { value: 0.2 },
        size: { value: { min: 1, max: 3 } },
        move: { enable: true, speed: 0.8, direction: "top" }
    }
});
render();
</script>

</html>
